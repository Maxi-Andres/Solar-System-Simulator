name: Deploy to GitHub Pages

# Runs on every push to main, plus a weekly refresh, a daily satellite refresh and a
# manual button.
#
# The weekly run is not cosmetic maintenance. The site ships a window of ephemerides
# baked in at build time, and re-running keeps that window centred on the present so
# there are always years of exact coverage ahead. Nothing degrades in between — DE441
# is a deterministic integration, so a deploy today already carries correct positions
# through 2031 — but the cron means the window never quietly drifts toward its edge.
on:
  push:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC: everything, fetched fresh.
    - cron: '0 6 * * 1'
    # Every day at 06:30 UTC: the Earth satellites only. Their elements are fitted for a
    # few days either side of the run (the bulk model is measured for ±3 days, see
    # tools/src/satellites/), so on a weekly deploy the published site would have none to
    # show four days in seven. Re-fetching CelesTrak takes seconds; re-fetching Horizons
    # takes an hour and a half and changes nothing in a day. So this run takes the rest
    # of the data from the last full run and fetches only the satellites.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress; a half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm must be installed before setup-node, or the pnpm store cache has
      # nothing to hook into.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # The daily satellite run is the only one that does not fetch everything.
      - name: Choose the run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            echo "satellites_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "satellites_only=false" >> "$GITHUB_OUTPUT"
          fi

      # The daily run: everything but the satellites from the last full run. Its data is
      # saved below under a key per run; the newest one matching the prefix comes back.
      # A full run restores it too, as the last good data to fall back on (next step).
      - name: Restore the last full run's data
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: web/public/data
          key: deploy-data-none
          restore-keys: |
            deploy-data-

      # A full run fetches everything afresh, but a catalogue whose host is down on the day
      # (VizieR, HyperLEDA, CDS, the Gaia archive, the CosmicFlows page -- one of them, most
      # pushes) is copied from the last full run's data instead of failing the deploy, with a
      # warning naming it (tools/src/fallback.ts). Moved out of the way, as the fetch empties
      # web/public/data; a cache restores only to the path it was saved from.
      - name: Keep the last full run's data as the fallback
        if: steps.mode.outputs.satellites_only != 'true' && steps.restore.outputs.cache-matched-key != ''
        run: |
          mkdir -p tools/.cache
          rm -rf tools/.cache/last-data
          mv web/public/data tools/.cache/last-data

      # The star catalogues (Hipparcos, Tycho-2, Gaia DR3) are the same every run, and their
      # hosts the least reachable from here: CDS's TAP refuses GitHub's runners and the Gaia
      # archive answers 429 to runs close together. Their answers are kept between runs,
      # keyed by the queries themselves; nothing that changes with the date is.
      - name: Restore the star catalogues' answers
        if: steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: tools/.cache/star-catalogues
          key: star-catalogues-none
          restore-keys: |
            star-catalogues-

      # Every other catalogue that does not change with the date -- VizieR's tables, HyperLEDA,
      # the CF4 cubes and watersheds, the Bright Star Catalogue (tools/src/downloadCache.ts) --
      # is kept the same way, so a host down on the day is not asked at all. The ones their
      # authors keep adding to (the ATNF's pulsars, Baumgardt's clusters, a rover's traverse)
      # are still asked every run, their last answer kept for when the host is down. Keyed
      # by what they hold, saved again only when that changed, as the cosmic web's.
      - name: Restore the catalogues' downloads
        id: downloads-restore
        if: steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: tools/.cache/downloads
          key: catalogue-downloads-none
          restore-keys: |
            catalogue-downloads-

      # A full run: the ephemerides always fetched fresh, never from cache -- the whole point
      # of it is to publish a window centred on today -- and a Horizons failure still fails
      # it (fetchData.ts says why). Also the daily run's fallback when no saved data came
      # back (the cache is evicted after a week unused); it has no last good data to fall
      # back on then, so there a catalogue that cannot be read fails it as before.
      - name: Fetch ephemerides from JPL Horizons
        if: steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == ''
        env:
          STAR_CATALOGUE_CACHE: ${{ github.workspace }}/tools/.cache/star-catalogues
          DOWNLOAD_CACHE: ${{ github.workspace }}/tools/.cache/downloads
          DATA_FALLBACK: ${{ github.workspace }}/tools/.cache/last-data
        run: pnpm fetch:data

      # Kept even when the fetch failed further on: the stars it did read need not be asked
      # for again.
      - name: Save the star catalogues' answers
        if: always() && (steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == '')
        uses: actions/cache/save@v6
        with:
          path: tools/.cache/star-catalogues
          key: star-catalogues-${{ github.run_id }}

      - name: Name the catalogues' downloads
        id: downloads-key
        if: always() && (steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == '')
        run: echo "key=catalogue-downloads-${{ hashFiles('tools/.cache/downloads/**') }}" >> "$GITHUB_OUTPUT"

      # Kept even when the fetch failed further on, as the star catalogues' are.
      - name: Save the catalogues' downloads
        if: always() && (steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == '') && hashFiles('tools/.cache/downloads/**') != '' && steps.downloads-key.outputs.key != steps.downloads-restore.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: tools/.cache/downloads
          key: ${{ steps.downloads-key.outputs.key }}

      # The cosmic web (tools/src/cosmicWeb/): the SDSS's galaxies and filaments, 400 MB from
      # VizieR, the IAS and the SDSS's archive -- three more hosts that can turn the runners away.
      # So it never fails the deploy: without it the site is built without the SDSS Galaxies and
      # Filaments layers (vite.config.ts looks for cosmic-web.json, written last), and says
      # nothing about them. It runs before the data is saved for the daily runs, so they carry
      # what it made. Its downloads are kept between runs, keyed by what they hold: published
      # catalogues that do not change, saved again only when a download was added.
      - name: Restore the cosmic web's downloads
        id: cosmic-web-restore
        if: steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: tools/.cache/cosmic-web
          key: cosmic-web-none
          restore-keys: |
            cosmic-web-

      - name: Fetch the cosmic web
        id: cosmic-web
        if: steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == ''
        continue-on-error: true
        run: pnpm fetch:cosmic-web --cache "${{ github.workspace }}/tools/.cache/cosmic-web"

      - name: Name the cosmic web's downloads
        id: cosmic-web-key
        if: always() && (steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == '')
        run: echo "key=cosmic-web-${{ hashFiles('tools/.cache/cosmic-web/**') }}" >> "$GITHUB_OUTPUT"

      # Kept even when the fetch failed further on, as the star catalogues' are.
      - name: Save the cosmic web's downloads
        if: always() && (steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == '') && hashFiles('tools/.cache/cosmic-web/**') != '' && steps.cosmic-web-key.outputs.key != steps.cosmic-web-restore.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: tools/.cache/cosmic-web
          key: ${{ steps.cosmic-web-key.outputs.key }}

      - name: Say whether the cosmic web was built
        if: steps.cosmic-web.outcome == 'failure'
        run: echo "::warning title=Cosmic web not built::pnpm fetch:cosmic-web failed; this deploy has no SDSS Galaxies or Filaments layers. Its log says why."

      # The quasars and the Planck SZ clusters (tools/src/quasars/): SDSS DR16Q's 750 thousand
      # quasars, 100 MB of text from VizieR, whose database is not always reachable. As the cosmic
      # web: it never fails the deploy -- without it the site is built without the Quasars and SZ
      # Clusters layers (vite.config.ts looks for quasars.json, written last) -- and its downloads
      # are kept between runs, keyed by what they hold. After the ephemerides' fetch, whose
      # laniakea.json it reads to leave out the clusters Laniakea names.
      - name: Restore the quasars' downloads
        id: quasars-restore
        if: steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: tools/.cache/quasars
          key: quasars-none
          restore-keys: |
            quasars-

      - name: Fetch the quasars
        id: quasars
        if: steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == ''
        continue-on-error: true
        run: pnpm fetch:quasars --cache "${{ github.workspace }}/tools/.cache/quasars"

      - name: Name the quasars' downloads
        id: quasars-key
        if: always() && (steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == '')
        run: echo "key=quasars-${{ hashFiles('tools/.cache/quasars/**') }}" >> "$GITHUB_OUTPUT"

      - name: Save the quasars' downloads
        if: always() && (steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == '') && hashFiles('tools/.cache/quasars/**') != '' && steps.quasars-key.outputs.key != steps.quasars-restore.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: tools/.cache/quasars
          key: ${{ steps.quasars-key.outputs.key }}

      - name: Say whether the quasars were built
        if: steps.quasars.outcome == 'failure'
        run: echo "::warning title=Quasars not built::pnpm fetch:quasars failed; this deploy has no Quasars or SZ Clusters layers. Its log says why."

      - name: Save the data for the daily satellite runs
        if: steps.mode.outputs.satellites_only != 'true' || steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: web/public/data
          key: deploy-data-${{ github.run_id }}

      # The daily run's whole job: today's elements over yesterday's. If CelesTrak refuses
      # (it answers 403 to a group fetched again before it updates, and runners share
      # addresses), the run fails here and publishes nothing: yesterday's site stays up.
      - name: Fetch Earth satellites from CelesTrak
        if: steps.mode.outputs.satellites_only == 'true' && steps.restore.outputs.cache-matched-key != ''
        run: pnpm fetch:satellites

      # Runs after the fetch so the integration tests have real data to check
      # against. They verify the published numbers against JPL's own values.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
