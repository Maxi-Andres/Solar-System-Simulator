name: Deploy to GitHub Pages

# Runs on every push to main, plus a weekly refresh and a manual button.
#
# The weekly run is not cosmetic maintenance. The site ships a window of ephemerides
# baked in at build time, and re-running keeps that window centred on the present so
# there are always years of exact coverage ahead. Nothing degrades in between — DE441
# is a deterministic integration, so a deploy today already carries correct positions
# through 2031 — but the cron means the window never quietly drifts toward its edge.
on:
  push:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress; a half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm must be installed before setup-node, or the pnpm store cache has
      # nothing to hook into.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # Always fetched fresh for a deploy, never from cache: the whole point of the
      # run is to publish a window centred on today.
      - name: Fetch ephemerides from JPL Horizons
        run: pnpm fetch:data

      # Runs after the fetch so the integration tests have real data to check
      # against. They verify the published numbers against JPL's own values.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
