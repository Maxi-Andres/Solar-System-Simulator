name: CI

# Checks on every branch except main, and on pull requests. Pushes to main are
# already covered end to end by the deploy workflow, so running both would just
# duplicate the work.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # The ephemerides are cached for the day. The integration tests check computed
      # positions against JPL's own numbers, so they need real data to be worth
      # running — but a fresh pull on every push would mean twenty requests to JPL
      # per commit. The window is rebuilt around "today", so a daily key is exactly
      # the right granularity.
      # GitHub Actions expressions have no date function, so the key is built here.
      - name: Compute cache key
        id: day
        run: echo "utc=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache ephemerides
        id: ephemerides
        uses: actions/cache@v6
        with:
          path: web/public/data
          key: ephemerides-${{ hashFiles('tools/src/**') }}-${{ steps.day.outputs.utc }}
          # Falls back to an earlier day's data if today's fetch cannot run. The
          # integration tests care that the numbers are real, not that they are from
          # this morning.
          restore-keys: |
            ephemerides-${{ hashFiles('tools/src/**') }}-

      # An earlier day's data, when that is what came back, is also the last good data a
      # catalogue whose host is down falls back on (tools/src/fallback.ts), as in the
      # deploy. Copied, not moved: if the fetch fails before it writes, the tests still have
      # it to run against.
      # (actions/cache says only whether the key matched exactly, so the data is looked for.)
      - name: Keep the earlier data as the fallback
        if: steps.ephemerides.outputs.cache-hit != 'true'
        run: |
          if [ -f web/public/data/manifest.json ]; then
            mkdir -p tools/.cache
            rm -rf tools/.cache/last-data
            cp -r web/public/data tools/.cache/last-data
          fi

      # The catalogues that do not change with the date, kept between runs as the deploy
      # keeps them (tools/src/downloadCache.ts); the deploy's, from main, come back here too.
      - name: Restore the catalogues' downloads
        id: downloads-restore
        if: steps.ephemerides.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: tools/.cache/downloads
          key: catalogue-downloads-none
          restore-keys: |
            catalogue-downloads-

      # Horizons' answers about the far past, as the deploy keeps them
      # (tools/src/horizons/responseCache.ts): the deploy's, from main, come back here. Not
      # saved from a branch -- a branch's caches are its own, and would only take room from
      # the deploy's.
      - name: Restore Horizons' answers about the past
        if: steps.ephemerides.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: tools/.cache/horizons
          key: horizons-answers-none
          restore-keys: |
            horizons-answers-

      # Allowed to fail. JPL Horizons is occasionally busy, and a pull request going
      # red because a third-party service had a bad minute tells you nothing about the
      # change under review. If the fetch fails and no cached data exists, the
      # integration tests skip themselves by design and the rest still runs. The
      # deploy workflow does NOT do this — there, missing data must stop the release,
      # and only a catalogue with a last good copy to fall back on may be stale.
      - name: Fetch ephemerides from JPL Horizons
        id: fetch
        if: steps.ephemerides.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          DOWNLOAD_CACHE: ${{ github.workspace }}/tools/.cache/downloads
          HORIZONS_CACHE: ${{ github.workspace }}/tools/.cache/horizons
          DATA_FALLBACK: ${{ github.workspace }}/tools/.cache/last-data
        run: pnpm fetch:data

      - name: Name the catalogues' downloads
        id: downloads-key
        if: always() && steps.ephemerides.outputs.cache-hit != 'true'
        run: echo "key=catalogue-downloads-${{ hashFiles('tools/.cache/downloads/**') }}" >> "$GITHUB_OUTPUT"

      # Kept even when the fetch failed further on: what it did read need not be asked for again.
      - name: Save the catalogues' downloads
        if: always() && steps.ephemerides.outputs.cache-hit != 'true' && hashFiles('tools/.cache/downloads/**') != '' && steps.downloads-key.outputs.key != steps.downloads-restore.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: tools/.cache/downloads
          key: ${{ steps.downloads-key.outputs.key }}

      - name: Note when ephemerides are unavailable
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::Could not fetch ephemerides from JPL Horizons."
          echo "::warning::Integration tests will skip themselves; unit tests still run."

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
